assets:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
timeframes:
  - 15m
  - 1h
  - 4h
  - 1d
signal_timeframes:
  - 4h
  - 1h
candle_limit: 720
risk:
  capital_usd: 10000
  risk_per_trade_pct: 0.5
  minimum_risk_per_trade_pct: 0.25
  volatility_target_annual_pct: 40
  max_notional_pct: 100
  minimum_rr: 1.5
  minimum_confidence: 62
  atr_stop_multiplier: 1.5
  max_open_signals_per_asset: 1
  max_portfolio_risk_pct: 1.5
  max_correlated_positions: 2
  cooldown_bars_after_loss: 4
strategy_v2:
  mode: shadow
  cost_gate_multiple: 3.0
  derivatives:
    minimum_open_interest_change_pct: -3.0
  regime:
    trend_adx_min: 22
    trend_efficiency_min: 0.30
    range_adx_max: 18
    range_efficiency_max: 0.25
  trend:
    enabled: true
    timeframes: [4h]
    breakout_period: 20
    relative_volume_min: 1.10
    initial_stop_atr: 2.5
    trailing_atr: 3.0
    expected_move_r: 3.0
    expected_holding_hours: 72
    no_followthrough_bars: 6
    max_holding_bars: 60
  range:
    enabled: true
    timeframes: [1h]
    zscore_entry: 2.0
    stop_atr: 1.5
    expected_holding_hours: 12
    max_holding_bars: 12
  relative_strength:
    enabled: true
    timeframe: 1d
    lookback_bars: 14
    max_rank: 3
validation:
  minimum_oos_trades: 150
  minimum_profit_factor: 1.2
  minimum_expectancy_r: 0.0
  maximum_drawdown_r: 12.0
  cost_stress_multiples: [1.0, 2.0, 3.0]
  walk_forward_folds: 4
execution:
  market: binance_usdm_futures
  # Valores conservadores configurables. Sustituir por las tasas reales de la cuenta.
  maker_fee_rate: 0.0002
  taker_fee_rate: 0.0005
  entry_order_type: taker
  exit_order_type: taker
  bnb_fee_discount_pct: 0.0
  spread_bps: 2.0
  slippage_bps: 3.0
  fallback_funding_rate: 0.0001
  fallback_funding_interval_hours: 8
  max_bars_open: 24
  tp1_close_fraction: 0.5
  move_stop_to_break_even: true
context:
  fear_greed_weight: 0.25
  macro_weight: 0.45
  btc_dominance_weight: 0.15
  onchain_weight: 0.15
alerts:
  telegram_enabled: true
storage:
  sqlite_path: backend/data/bot.db
  output_dir: backend/data
dashboard:
  public_data_dir: dashboard/public/data
network:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.0
